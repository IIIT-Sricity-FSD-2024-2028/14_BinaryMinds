<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Officer Verification</title>
    <link rel="stylesheet" href="style.css">
    <script src="../session_guard.js"></script>
</head>
<body>

<!-- 🔷 Top Header -->
<header class="top-header">
    <div class="logo-section">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" class="emblem" height="45">
        <div>
            <h4>Government of India</h4>
            <h2>TradeZo</h2>
        </div>
    </div>

    <div class="header-right">
        <div class="user-info">
            <span>Welcome</span>
            <b>Myra</b>
        </div>

        <div class="header-icons">
<img src="../assets/icons/logout.png" class="header-icon" onclick="foLogout()" style="cursor:pointer">
        </div>
    </div>
</header>

<!-- 🔷 Main Layout -->
<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <ul>
            <li>
                <img src="../assets/icons/db.png" class="icon">
                Dashboard
            </li>

            <li class="active">
                <img src="../assets/icons/verification.png" class="icon">
                Verification
            </li>

            <li>
                <img src="../assets/icons/inspection.png" class="icon">
                Record Inspection
            </li>

            <li>
                <img src="../assets/icons/verification-history.png" class="icon">
                Verification History
            </li>

            <li>
                <img src="../assets/icons/inspection-history.png" class="icon">
                Inspection History
            </li>

            <li>
                <img src="../assets/icons/profile.png" class="icon">
                Profile
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main">
        <h2>Verification</h2>
        <p class="subtitle">Review and verify submitted trade license applications.</p>

        <!-- Search -->
        <div class="search-bar">
            <span class="search-icon">&#128269;</span>
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchCards()">
        </div>

        <p class="count" id="countText"></p>

        <!-- 🔥 DYNAMIC CARDS WILL COME HERE -->
        <div class="cards-grid" id="verificationList"></div>

    </div>
</div>

<script src="../../mockdata.js?v=fo-assignment-filter-20260505-2"></script>
<script src="../fo_nav.js?v=fo-assignment-filter-20260505-2"></script>
<script src="../fodashboard/db.js?v=fo-assignment-filter-20260505-2"></script>

<!-- 🔥 SCRIPT FOR DYNAMIC DATA -->
<script>
function loadVerificationApps() {
    // Leverage the dashboard's exact data fetching logic so they are 100% in sync
    let applications = typeof getAssignedApplications === 'function' ? getAssignedApplications() : [];

    let container = document.getElementById("verificationList");
    container.innerHTML = "";

    let decidedHistory = JSON.parse(localStorage.getItem('tz_verification_history')) || [];
    let decidedIds = decidedHistory.map(item => item.appId);

    let pendingApps = applications.filter(app => {
        let status = (app.status || "").toLowerCase();
        let isDecided = decidedIds.includes(app.id || app.appRef) || status === 'approved' || status === 'rejected' || status.includes('completed');
        return !isDecided;
    });

    if (window.TRADEZO && typeof TRADEZO.sortFreshFirst === 'function') {
        TRADEZO.sortFreshFirst(pendingApps);
    } else {
        pendingApps.reverse();
    }
    
    if (pendingApps.length === 0) {
        container.innerHTML = "<p>No pending applications for verification.</p>";
        document.getElementById("countText").innerText = "0 applications";
        return;
    }
    
    pendingApps.forEach(app => {
        let applicant = app.applicantName || app.applicant || app.ownerName || "Applicant";
        let id = app.id || app.appRef || app.application_id || "";
        let business = app.businessName || app.business || "N/A";
        let tradeType = app.tradeCategory || app.licenseType || app.category || app.businessType || "N/A";
        let submittedDate = app.submittedDate || app.date || app.createdAt || "N/A";
        let card = `
            <div class="card">
                <div class="card-top"></div>
                <div class="card-body">
                    <h3>${applicant}</h3>
                    <p class="app-id">${id}</p>
                    <p>Business: ${business}</p>
                    <p>Type: ${tradeType}</p>
                    <p>Date: ${submittedDate}</p>
                    <p>Status: ${app.status || "Assigned"}</p>

                    <button onclick="viewDetails('${id}')">View Details</button>
                </div>
            </div>
        `;
        container.innerHTML += card;
    });

    document.getElementById("countText").innerText = pendingApps.length + " application(s)";
}

function viewDetails(id) {
    sessionStorage.setItem('selectedApp', id);
    window.location.href = "../detail/index.html";
}


function searchCards() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "block" : "none";
    });
}

document.addEventListener('DOMContentLoaded', loadVerificationApps);
</script>

</body>
</html>

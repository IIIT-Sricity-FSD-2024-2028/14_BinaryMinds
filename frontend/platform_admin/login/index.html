<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TradeZo Platform Admin</title>
  <link rel="stylesheet" href="../platform.css">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">TradeZo Internal Access</p>
    <h1>TradeZo Platform Admin</h1>
    <p>Platform management &amp; revenue administration</p>
    <form id="platform-login">
      <label>Email
        <input id="email" type="email" required autocomplete="username" placeholder="superadmin@tradezo.gov.in">
      </label>
      <label>Password
        <input id="password" type="password" required autocomplete="current-password" placeholder="admin123">
      </label>
      <p id="error" role="alert"></p>
      <button type="submit">Sign in</button>
    </form>

    <!-- Demo Credentials at bottom for testing -->
    <div style="margin-top: 20px; padding: 12px 14px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; color: #334155; line-height: 1.5; text-align: left;">
      <strong style="color: #1E3A8A; display: block; margin-bottom: 4px;">🔑 Demo Super Admin Credentials:</strong>
      <div><strong>Email:</strong> <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">superadmin@tradezo.gov.in</code></div>
      <div style="margin-top:2px;"><strong>Password:</strong> <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">admin123</code></div>
    </div>

    <div style="margin-top: 14px;">
      <a href="../../applicant_connected/connected/landing%20page/index.html" style="font-size:13px; color:#64748b; text-decoration:none;">← Return to public home</a>
    </div>
  </main>
  <script src="login.js"></script>
</body>
</html>
